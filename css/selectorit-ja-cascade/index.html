<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <link rel="stylesheet" href="css/tyyli.css">
</head>

<body>


    <p id="intro" class="lead">EFGEWNVOIW WEFJ </p>


    <article class="post">
        <h2>Otsikko</h2>
        <p>Johdanto</p>
        <h2>Otsikko 2</h2>
        <section>

            <p>Leipäteksti</p>
            <h2>Otsikko 3</h2>
        </section>
    </article>

    <form>
        <label for="nimi">Nimi</label>
        <input type="text" id="nimi" name="nimi" required>

        <div class="form-group">
            <label for="posti">Sähköposti</label>
            <input type="email" id="posti" name="posti" required>
        </div>

        <label for="opiskelija">
            <input type="checkbox" id="opiskelija" name="opiskelija">
            Opiskelija
        </label>
        <label for="tyoton">
            <input type="checkbox" id="tyoton" name="tyoton">
            Työtön
        </label>

        <button type="submit">Lähetä</button>


    </form>
</body>

</html>
