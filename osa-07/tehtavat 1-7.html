<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/tyyli.css" />
        <title>Tehtävät 1-7</title>
    </head>
    <body>
        <h1>Osa 7:n harjoitukset</h1>

        <form action="" method="post">
            <label for="nimi">Nimi:</label>
            <input type="text" id="nimi" name="nimi" />

            <label for="sahkoposti">Sähköposti:</label>
            <input type="email" id="sahkoposti" name="sahkoposti" required />

            <label for="salasana">Salasana:</label>
            <input type="password" id="salasana" name="salasana" required />

            <label for="kayttajatunnus">Käyttäjätunnus</label>
            <input
                type="text"
                id="kayttajatunnus"
                name="kayttajatunnus"
                minlength="4"
                maxlength="12"
                required
            />

            <label for="ika">Ikä:</label>
            <input type="number" id="ika" name="ika" />

            <label for="viesti">Viesti:</label>
            <textarea
                name="viesti"
                id="viesti"
                rows="5"
                placeholder="Kirjoita viestisi tähän"
            ></textarea>

            <fieldset class="koko-rivin-leveys">
                <legend>Yhteystiedot</legend>
                <label for="nimi">Nimi:</label>
                <input type="text" id="nimi" name="nimi" />

                <label for="sahkoposti">Sähköposti:</label>
                <input
                    type="email"
                    id="sahkoposti"
                    name="sahkoposti"
                    required
                />
            </fieldset>

            <fieldset class="koko-rivin-leveys">
                <legend>Oletko opiskelija?</legend>
                <label
                    ><input
                        type="radio"
                        name="on-opiskelija"
                        value="true"
                    />Kyllä</label
                >
                <label
                    ><input
                        type="radio"
                        name="on-opiskelija"
                        value="false"
                    />En</label
                >
            </fieldset>

            <label for="kurssi">Valitse kurssi:</label>
            <select name="kurssi" id="kurssi">
                <option value="tvt">TVT</option>
                <option value="ohjelmoimti">Ohjelmoimti</option>
                <option value="suomen" selected>Suomen kieli</option>
            </select>

            <label class="koko-rivin-leveys"
                >Tilaa uutiskirje
                <input type="checkbox" name="uutiskirje" />
            </label>

            <button type="submit">Lähetä</button>
        </form>
    </body>
</html>
