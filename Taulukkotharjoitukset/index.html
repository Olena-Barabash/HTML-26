<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perustaulukko</title>
</head>

<body>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
            overflow-x: auto;
        }

        td,
        th {
            border: 1px solid #ccc;
            padding: 0.5rem;
        }

        tr td:nth-child(1) {
            text-align: left;
        }

        tfoot,
        thead,
        tr td:nth-child(5) {
            font-weight: 600;
            background-color: #f4f4f4;
        }
    </style>
    <table>
        <caption>Kurssipisteet</caption>
        <thead>
            <tr>
                <th>Nimi</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>JavaScript</th>
                <th>Yhteensä</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Opiskelija 1</td>
                <td>5</td>
                <td>4</td>
                <td>4</td>
                <td>13</td>
            </tr>
            <tr>
                <td>Opiskelija 2</td>
                <td>4</td>
                <td>5</td>
                <td>3</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Opiskelija 3</td>
                <td>5</td>
                <td>5</td>
                <td>3</td>
                <td>13</td>
            </tr>
            <tr>
                <td>Opiskelija 4</td>
                <td>4</td>
                <td>3</td>
                <td>5</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Opiskelija 5</td>
                <td>5</td>
                <td>5</td>
                <td>5</td>
                <td>15</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Keskiarvo</td>
                <td>4,6</td>
                <td>4,4</td>
                <td>4</td>
                <td>13</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
